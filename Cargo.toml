[package]
name = "tauri-plugin-nostrnative"
version = "0.2.0"
description = "Nostr native capabilities for Tauri"
authors = ["nostrnative"]
license = "MIT"
repository = "https://github.com/nostrnative/tauri-plugin-nostrnative"
edition = "2024"
links = "tauri-plugin-nostrnative"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nostr-sdk = { version = "0.44", features = ["nip04", "nip44", "nip59"] }
nostr = { version = "0.44", features = ["nip44", "nip46"] }
nostr-relay-builder = { version = "0.44", optional = true }
nostr-database = { version = "0.44", features = ["flatbuf"], optional = true }
nostr-lmdb = { version = "0.44", optional = true }
nostr-connect = "0.44"
once_cell = "1.20"
tauri = { version = "2.0", optional = true }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls", "gzip", "brotli", "deflate", "zstd"], optional = true }
base64 = { version = "0.22", optional = true }
urlencoding = { version = "2.1", optional = true }
sha2 = { version = "0.10", optional = true }
hkdf = { version = "0.13", optional = true }
hex = { version = "0.4", optional = true }
serde_cbor = { version = "0.11", optional = true }
chrono = { version = "0.4", optional = true }

[dev-dependencies]
nostr-relay-builder = "0.44"
tokio = { version = "1", features = ["full", "test-util"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[features]
default = ["keys", "calendar", "tauri-plugin"]
full = ["keys", "calendar", "profile", "messages", "bookmarks", "notes", "blossom", "chat", "nfp", "virtual-fs", "relay", "tauri-plugin", "routstr"]
keys = []
relay = ["dep:nostr-relay-builder", "dep:nostr-database", "dep:nostr-lmdb"]
virtual-fs = ["keys", "dep:serde_cbor", "dep:base64", "dep:chrono"]
calendar = ["keys", "dep:hkdf", "dep:sha2", "dep:hex"]
profile = ["keys"]
messages = ["keys"]
bookmarks = ["keys", "dep:hex"]
notes = ["keys"]
blossom = ["keys", "dep:reqwest", "dep:base64", "dep:urlencoding", "dep:sha2"]
chat = ["keys", "dep:hkdf", "dep:sha2", "dep:hex"]
nfp = ["keys"]
routstr = ["keys"]
tauri-plugin = ["dep:tauri"]
