[package]
name = "tauri-plugin-nostrnative"
version = "0.1.4"
description = "Nostr native capabilities for Tauri"
authors = ["nostrnative"]
license = "MIT"
repository = "https://github.com/nostrnative/tauri-plugin-nostrnative"
edition = "2024"
links = "tauri-plugin-nostrnative"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nostr-sdk = { version = "0.44.0", features = ["nip04", "nip44", "nip59"] }
nostr = { version = "0.44", features = ["nip44", "nip46"] }
nostr-connect = "0.44"
tauri = { version = "2.0", optional = true }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"], optional = true }
base64 = { version = "0.22", optional = true }
urlencoding = { version = "2.1", optional = true }
sha2 = { version = "0.10", optional = true }
hkdf = { version = "0.12", optional = true }
hex = { version = "0.4", optional = true }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[features]
default = ["keys"]
full = ["keys", "calendar", "profile", "messages", "bookmarks", "notes", "blossom", "chat"]
keys = []
calendar = ["keys"]
profile = ["keys"]
messages = ["keys"]
bookmarks = ["keys", "dep:hex"]
notes = ["keys"]
blossom = ["keys", "dep:reqwest", "dep:base64", "dep:urlencoding", "dep:sha2"]
chat = ["keys", "dep:hkdf", "dep:sha2", "dep:hex"]
tauri-plugin = ["dep:tauri"]
